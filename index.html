<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>無料タイピング練習｜初心者向けタイピングゲーム</title>

  <meta name="description" content="無料で楽しめるタイピング練習。日本語、英語などの言語に対応したシンプルなタイピングゲームです。">

  <link rel="stylesheet" href="hinomaru.css">
</head>

<body>

  <main class="container">

    <div class="language-box">
      <select id="language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
      </select>
    </div>


    <h1 id="title">無料タイピング練習</h1>


    <div id="word"></div>


    <div class="info">

      <span>
        <span id="correctText">正解：</span>
        <b id="correct">0</b>
      </span>

      <span>
        <span id="missText">ミス：</span>
        <b id="miss">0</b>
      </span>

    </div>


    <div class="keyboard">

      <div class="row">

        <div class="key" data-key="q">Q</div>
        <div class="key" data-key="w">W</div>
        <div class="key" data-key="e">E</div>
        <div class="key" data-key="r">R</div>
        <div class="key" data-key="t">T</div>
        <div class="key" data-key="y">Y</div>
        <div class="key" data-key="u">U</div>
        <div class="key" data-key="i">I</div>
        <div class="key" data-key="o">O</div>
        <div class="key" data-key="p">P</div>

      </div>


      <div class="row">

        <div class="key" data-key="a">A</div>
        <div class="key" data-key="s">S</div>
        <div class="key" data-key="d">D</div>
        <div class="key" data-key="f">F</div>
        <div class="key" data-key="g">G</div>
        <div class="key" data-key="h">H</div>
        <div class="key" data-key="j">J</div>
        <div class="key" data-key="k">K</div>
        <div class="key" data-key="l">L</div>

      </div>


      <div class="row">

        <div class="key" data-key="z">Z</div>
        <div class="key" data-key="x">X</div>
        <div class="key" data-key="c">C</div>
        <div class="key" data-key="v">V</div>
        <div class="key" data-key="b">B</div>
        <div class="key" data-key="n">N</div>
        <div class="key" data-key="m">M</div>

      </div>

    </div>


    <!-- タイピング練習のやり方 -->

    <section class="practice-guide">

      <h2 id="guideTitle">
        タイピング練習のやり方
      </h2>

      <p id="guideText">
        画面に表示された文字をキーボードで入力してください。
        正しく入力すると次の文字へ進みます。
        間違えるとミスとしてカウントされます。
        楽しみながら繰り返し練習しましょう。
      </p>

    </section>


    <!-- フッター -->

    <footer class="site-footer">

      <p>Yuusho-DCT Corporation</p>

      <p>所在地：Japan</p>

    </footer>


  </main>


  <script src="hinomaru.js"></script>

</body>

</html>
