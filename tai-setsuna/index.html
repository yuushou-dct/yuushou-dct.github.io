<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>TAI-SETSUNA-瞬｜タイピング速度ゲーム</title>

  <meta name="description"
        content="TAI-SETSUNA-瞬。タイピング速度をkm/hで楽しむ無料タイピングゲーム。">

  <link rel="stylesheet"
        href="taisetsuna.css">

</head>

<body>

  <main class="container">


    <!-- タイトル -->

    <div class="title-area">

      <h1>
        TAI-SETSUNA-瞬
      </h1>

      <span class="lightning"></span>

    </div>


    <p class="message">
      速度を制す者は、タイピングを制す‼
    </p>


    <!-- 速度 -->

    <section class="speed-area">

      <div class="speed-main">

        <span id="speed">0</span>

        <span class="kmh">
          km/h
        </span>

      </div>


      <div class="speed-line"></div>


      <div class="mph-area">

        <span id="mph">0</span>

        <span class="mph-unit">
          mph
        </span>

      </div>

    </section>


    <!-- 問題 -->

    <section class="word-area">

      <p class="target">
        TARGET
      </p>

      <div id="word">
        READY
      </div>


      <input
        type="text"
        id="typingInput"
        placeholder="ここに入力"
        autocomplete="off"
        spellcheck="false"
        disabled
      >

    </section>


    <!-- 成績 -->

    <section class="result-area">

      <div class="result-box">

        <span class="result-label">
          正解
        </span>

        <span
          id="correct"
          class="correct-number">
          0
        </span>

      </div>


      <div class="result-divider"></div>


      <div class="result-box">

        <span class="result-label">
          ミス
        </span>

        <span
          id="miss"
          class="miss-number">
          0
        </span>

      </div>


      <div class="result-divider"></div>


      <div class="result-box">

        <span class="result-label">
          最高速度
        </span>

        <span
          id="bestSpeed"
          class="best-number">
          0
        </span>

        <span class="best-unit">
          km/h
        </span>

      </div>

    </section>


    <!-- START -->

    <button id="startBtn">
      START
    </button>


    <p class="setsuna-message">

      一瞬の判断。一瞬の入力。<br>

      その一打が、速度を変える。

    </p>


  </main>


  
  <script src="taisetsuna.js"></script>

</body>

</html>
